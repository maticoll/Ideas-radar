name: Cron - Collect

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Call collect endpoint
        run: |
          curl -f -X GET "${{ secrets.APP_URL }}/api/cron/collect" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
